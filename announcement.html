<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公告 - 大风大浪集团</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect x='2' y='2' width='44' height='44' rx='10' fill='%2304060d' stroke='%2321e6ff' stroke-width='2.5'/%3E%3Cpath d='M10 30c5-8 9-8 14 0s9 8 14 0' fill='none' stroke='%2321e6ff' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Orbitron:wght@500;700;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
:root{--bg0:#04060d;--ink:#e9f1ff;--mut:#8ea3c9;--dim:#5c7096;--cy:#21e6ff;--line:rgba(116,154,255,.14);--grad:linear-gradient(100deg,#21e6ff 0%,#3d7bff 45%,#8a5cff 100%);--font-d:"Orbitron","Noto Sans SC",sans-serif;--font-c:"Noto Sans SC","Microsoft YaHei",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-c);background:var(--bg0);color:var(--ink);line-height:1.6;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(62vw 48vw at 82% -8%,rgba(61,123,255,.12),transparent 60%),radial-gradient(52vw 42vw at 6% 34%,rgba(138,92,255,.09),transparent 62%)}
header{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:0 clamp(16px,4vw,40px);height:68px;background:rgba(5,8,18,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:38px;height:38px;filter:drop-shadow(0 0 10px rgba(33,230,255,.35))}
.logo b{font-size:18px;font-weight:900;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid rgba(33,230,255,.4);color:#bfeaff;font-size:13px;letter-spacing:2px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:.3s;background:rgba(33,230,255,.05)}
.back-btn:hover{background:var(--cy);color:#04121f;box-shadow:0 0 20px rgba(33,230,255,.4)}
.back-btn svg{width:16px;height:16px}
main{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:60px 24px 80px}
.page-head{text-align:center;margin-bottom:50px}
.page-kick{font-family:var(--font-d);font-size:13px;letter-spacing:5px;color:var(--cy);text-transform:uppercase;margin-bottom:14px}
.page-title{font-size:clamp(32px,5vw,52px);font-weight:900;letter-spacing:4px;background:linear-gradient(115deg,#fff,#a8e2ff 30%,#21e6ff 60%,#8f8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.announce-list{display:flex;flex-direction:column;gap:24px}
.announce-card{background:linear-gradient(165deg,rgba(15,23,45,.7),rgba(8,12,26,.92));border:1px solid var(--line);padding:30px 32px;position:relative;overflow:hidden;transition:.35s}
.announce-card:hover{border-color:rgba(33,230,255,.5);transform:translateY(-4px);box-shadow:0 18px 46px rgba(2,5,14,.6)}
.announce-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.announce-date{font-family:var(--font-d);font-size:13px;color:var(--cy);letter-spacing:2px;margin-bottom:10px}
.announce-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:10px;letter-spacing:1px}
.announce-body{color:var(--mut);font-size:15px;line-height:1.9}
.announce-tag{display:inline-block;font-size:11px;padding:3px 10px;background:rgba(255,102,0,.15);border:1px solid rgba(255,102,0,.4);color:#ff9944;letter-spacing:2px;margin-bottom:12px}
footer{position:relative;z-index:2;text-align:center;padding:30px;color:var(--dim);font-size:13px;border-top:1px solid var(--line);margin-top:40px}
</style>
</head>
<body>
<div class="bg-glow"></div>
<header>
  <a class="logo" href="index.html">
    <svg class="mark" viewBox="0 0 48 48" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="48" y2="48"><stop offset="0" stop-color="#21e6ff"/><stop offset="1" stop-color="#8a5cff"/></linearGradient></defs>
      <rect x="2" y="2" width="44" height="44" rx="10" stroke="url(#lg)" stroke-width="2" fill="rgba(33,230,255,.06)"/>
      <path d="M10 30c5-8 9-8 14 0s9 8 14 0" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M10 20c5-8 9-8 14 0s9 8 14 0" stroke="url(#lg)" stroke-width="2.6" stroke-linecap="round" opacity=".5"/>
    </svg>
    <b>大风大浪集团</b>
  </a>
  <a class="back-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    返回首页
  </a>
</header>
<main>
  <div class="page-head">
    <p class="page-kick">NOTICE</p>
    <h1 class="page-title">集团公告</h1>
  </div>
  <div class="announce-list">
    <div class="announce-card">
      <span class="announce-tag">最新</span>
      <p class="announce-date">2026-09-08</p>
      <h2 class="announce-title">震惊，马厕班午睡时间荣耀同学一个屁崩醒全班</h2>
      <p class="announce-body">据可靠消息，2026年9月8日午睡时间，马厕班荣耀同学在睡梦中突然放出一个惊天响屁，当场崩醒全班同学，场面一度十分尴尬。后续处理结果待公布。</p>
    </div>
  </div>
</main>
<footer>大风大浪集团 © 2026 版权所有</footer>
</body>
</html>
